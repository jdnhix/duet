<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duet</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">&#9834;</span>
      <div>
        <h1>Duet</h1>
        <p class="tagline">Pair your songs. When one plays, its partner is queued next.</p>
      </div>
    </div>
    <div class="account" id="account"></div>
  </header>

  <main>
    <section class="card now" id="now">
      <span class="label">Now playing</span>
      <div id="now-body" class="now-body muted">Nothing playing</div>
    </section>

    <section class="card">
      <h2>New pair</h2>
      <div class="builder">
        <div class="slot" data-slot="trigger">
          <span class="label">When this plays</span>
          <div class="picker">
            <input type="search" placeholder="Search a song&hellip;" autocomplete="off" data-role="input">
            <div class="results" data-role="results" hidden></div>
          </div>
          <div class="chosen" data-role="chosen" hidden></div>
        </div>

        <div class="arrow">&#8594;</div>

        <div class="slot" data-slot="follower">
          <span class="label">Queue this next</span>
          <div class="picker">
            <input type="search" placeholder="Search a song&hellip;" autocomplete="off" data-role="input">
            <div class="results" data-role="results" hidden></div>
          </div>
          <div class="chosen" data-role="chosen" hidden></div>
        </div>

        <button id="create" disabled>Pair</button>
      </div>
      <p class="error" id="builder-error" hidden></p>
    </section>

    <section class="card">
      <h2>Pairs <span class="count" id="rule-count"></span></h2>
      <div id="rules"></div>
    </section>

    <section class="card">
      <h2>Activity</h2>
      <div id="events" class="events"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
